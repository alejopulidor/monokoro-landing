<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG · Monokoro</title>
<!--
  The one social-card template. Every card in public/og/ is this file rendered
  by headless Chrome with different content.

  Standalone on purpose: next/font and the site's @theme tokens do not exist
  out here, so the fonts come from the Google Fonts CDN and every colour is
  copied literally from app/globals.css. That is also why the render needs
  --virtual-time-budget: without it the screenshot fires before the webfonts
  land and you get fallback type.

  Content arrives as base64-encoded JSON in the URL hash — a query string
  would work too, but the hash survives the file:// URL quoting on Windows
  without escaping every accent. See scripts/og/render.mjs.

  Do NOT open this file expecting to see a card: with no hash it renders the
  placeholder below.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Locked to the exact card size. `overflow: hidden` is what guarantees a
     long headline crops instead of silently resizing the capture. */
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: linear-gradient(150deg, #12464C, #07242A);
    color: #EFF6F0;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The same decoration the dark panels use on the site. Static positions —
     the animations in globals.css would be mid-flight at capture time. */
  .aur-a {
    position: absolute;
    width: 840px; height: 820px;
    left: -170px; top: -280px;
    border-radius: 50%;
    filter: blur(70px);
    background: radial-gradient(circle, rgba(106,221,155,.34), transparent 68%);
  }
  .aur-b {
    position: absolute;
    width: 760px; height: 740px;
    right: -220px; bottom: -320px;
    border-radius: 50%;
    filter: blur(80px);
    background: radial-gradient(circle, rgba(51,130,137,.46), transparent 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(106,221,155,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(106,221,155,.055) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 0%, #000 25%, transparent 78%);
  }

  .frame {
    position: absolute; inset: 0;
    padding: 58px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- brand row -------------------------------------------------------- */
  header { display: flex; align-items: center; gap: 14px; }
  .wordmark { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }

  .kicker {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .14em;
    color: #6ADD9B;
    /* Pinned: a kicker that wraps is invisible until the card is already live. */
    white-space: nowrap;
  }

  /* --- headline --------------------------------------------------------- */
  h1 {
    font-weight: 600;
    font-size: 76px;
    line-height: .98;
    letter-spacing: -.042em;
    max-width: 17ch;
    text-wrap: balance;
  }
  /* Long article titles get a step down rather than a crop. */
  body.long h1 { font-size: 62px; max-width: 20ch; }

  h1 em { font-style: normal; color: #6ADD9B; }

  p.sub {
    margin-top: 24px;
    font-size: 26px;
    line-height: 1.4;
    color: rgba(239,246,240,.82);
    max-width: 40ch;
    text-wrap: pretty;
  }

  /* --- footer ----------------------------------------------------------- */
  .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
  }
  .chips { display: flex; gap: 12px; flex-shrink: 0; }
  .chip {
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid rgba(106,221,155,.42);
    background: rgba(106,221,155,.10);
    font-size: 19px;
    font-weight: 500;
    white-space: nowrap;
  }
  .trust {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: .1em;
    color: rgba(239,246,240,.55);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6ADD9B; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="aur-a"></div>
  <div class="aur-b"></div>
  <div class="grid"></div>

  <div class="frame">
    <header>
      <!-- The single-path isotipo, same geometry as components/site/brand.tsx. -->
      <svg width="40" height="32.6" viewBox="0 0 478 390" aria-hidden="true">
        <path transform="translate(239,195) rotate(45)" fill="#6ADD9B" fill-rule="evenodd"
          d="M -216.7 -33.3 A 60 60 0 0 1 -156.7 -93.3 L -91.9 -93.3 L -91.9 -157.8 A 60 60 0 0 1 -31.9 -217.8 L 95.2 -217.8 A 60 60 0 0 1 155.2 -157.8 L 155.2 95.2 A 60 60 0 0 1 95.2 155.2 L -156.7 155.2 A 60 60 0 0 1 -216.7 95.2 Z M -76.4 -92 L -76.4 -157.8 A 44.5 44.5 0 0 1 -31.9 -202.3 L 95.2 -202.3 A 44.5 44.5 0 0 1 139.7 -157.8 L 139.7 -143 A 51 51 0 0 1 88.7 -92 Z" />
      </svg>
      <span class="wordmark">Monokoro</span>
      <span class="kicker" id="kicker">DÓLARES DIGITALES · COLOMBIA</span>
    </header>

    <div>
      <h1 id="title">Ahorra en dólares.<br>Desde WhatsApp.</h1>
      <p class="sub" id="sub">Sin hash en la URL: esto es el placeholder del template.</p>
    </div>

    <div class="foot">
      <div class="chips" id="chips"></div>
      <div class="trust"><span class="dot"></span><span id="trust">MONOKORO.CO</span></div>
    </div>
  </div>

<script>
  // Hash → JSON. `escape`/`decodeURIComponent` round-trips UTF-8 through
  // atob, which only speaks latin1 — without it every accent comes out mojibake.
  var raw = location.hash.slice(1);
  if (raw) {
    var d = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (d.kicker) document.getElementById('kicker').textContent = d.kicker;
    // `title` is trusted markup from scripts/og/cards.json, not user input —
    // it carries <br> and <em> to control the line break and the accent.
    if (d.title) document.getElementById('title').innerHTML = d.title;
    if (d.sub) document.getElementById('sub').textContent = d.sub;
    if (d.trust) document.getElementById('trust').textContent = d.trust;
    if (d.long) document.body.classList.add('long');
    if (d.chips) {
      document.getElementById('chips').innerHTML = d.chips
        .map(function (c) { return '<span class="chip"></span>'; }).join('');
      var nodes = document.querySelectorAll('#chips .chip');
      d.chips.forEach(function (c, i) { nodes[i].textContent = c; });
    }
  }
</script>
</body>
</html>
